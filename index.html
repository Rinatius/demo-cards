<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Cards</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --border: #e2e0d9; --accent: #2f5d8a; --reported: #a8650a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ecebe6; --muted: #a09e97;
      --border: #34332f; --accent: #7fb0e0; --reported: #e0a64a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 32px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  nav button {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .9rem; cursor: pointer;
  }
  nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding-bottom: 48px; }
  article {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  }
  figure { margin: -18px -20px 4px; position: relative; }
  figure img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #0b1626; }
  figcaption { position: absolute; left: 10px; top: 6px; font-size: .7rem; color: #e8eef5; opacity: .85; text-shadow: 0 1px 3px #000; }
  figcaption a { color: inherit; }
  .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); }
  .cat { text-transform: uppercase; letter-spacing: .04em; font-weight: 600; color: var(--accent); }
  h2 { margin: 0; font-size: 1.1rem; line-height: 1.3; }
  article p { margin: 0; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; }
  .foot a { color: var(--accent); }
  .tag { font-style: italic; color: var(--reported); }
</style>
</head>
<body>
<header>
  <h1 id="title">News Cards</h1>
  <p class="sub" id="sub">Loading…</p>
  <nav id="filters"></nav>
</header>
<main><div class="grid" id="grid"></div></main>
<script>
  const params = new URLSearchParams(location.search);
  let topicId;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

  async function load() {
    const topics = await (await fetch('cards/topics.json')).json();
    const topic = topics.find(t => t.id === params.get('topic')) || topics[0];
    topicId = topic.id;
    const cards = await (await fetch(`cards/${topic.id}/cards.json`)).json();
    document.title = `${topic.title} · News Cards`;
    document.getElementById('title').textContent = topic.title;
    document.getElementById('sub').textContent = `${cards.length} cards · updated ${topic.updated}`;

    const categories = ['All', ...new Set(cards.map(c => c.category))];
    const nav = document.getElementById('filters');
    const render = cat => {
      nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.textContent === cat));
      const grid = document.getElementById('grid');
      grid.replaceChildren(...cards.filter(c => cat === 'All' || c.category === cat).map(card));
    };
    categories.forEach(cat => {
      const b = el('button', '', cat);
      b.onclick = () => render(cat);
      nav.append(b);
    });
    render('All');
  }

  const resolveSrc = s => /^https?:/.test(s) ? s : `cards/${topicId}/${s}`;

  function card(c) {
    const a = el('article');
    a.id = c.id;
    const meta = el('div', 'meta');
    meta.append(el('span', 'cat', c.category), el('span', '', c.date));
    const foot = el('div', 'foot');
    const src = el('a', '', c.source.name);
    src.href = c.source.url; src.target = '_blank'; src.rel = 'noopener';
    foot.append(src);
    if (c.confidence === 'reported') foot.append(el('span', 'tag', 'Reported'));
    if (c.image) {
      const fig = el('figure');
      const img = el('img');
      const cap = el('figcaption', '', c.image.credit);
      if (c.image.page) {
        const link = el('a', '', c.image.credit);
        link.href = c.image.page; link.target = '_blank'; link.rel = 'noopener';
        cap.replaceChildren(link);
      }
      // If a remote photo fails to load, fall back to the card's illustration.
      img.onerror = () => {
        if (!c.image.fallback || img.dataset.fellBack) return;
        img.dataset.fellBack = '1';
        img.src = resolveSrc(c.image.fallback);
        cap.textContent = 'Illustration, not a photo';
      };
      img.src = resolveSrc(c.image.src);
      img.alt = c.image.alt || ''; img.loading = 'lazy';
      fig.append(img);
      if (c.image.credit) fig.append(cap);
      a.append(fig);
    }
    a.append(meta, el('h2', '', c.headline), el('p', '', c.body), foot);
    return a;
  }

  load().catch(err => { document.getElementById('sub').textContent = 'Could not load cards: ' + err.message; });
</script>
</body>
</html>
